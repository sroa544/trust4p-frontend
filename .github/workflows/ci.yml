name: CI

# Integración continua: toda propuesta de cambio debe pasar lint, pruebas y
# compilación, y la imagen debe construirse y servir la aplicación.
on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  imagen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir la imagen
        run: docker build -t trust4p-frontend:ci .
      - name: Humo del proxy inverso (la imagen sirve la SPA y reenvía a un backend de prueba)
        run: |
          docker network create prueba
          docker run -d --name backend --network prueba python:3.13-alpine \
            python -m http.server 8000 --directory /tmp
          docker run -d --name web --network prueba -p 8080:8080 \
            -e PORT=8080 \
            -e API_NEGOCIO_URL=http://backend:8000 \
            -e API_AGENTE_URL=http://backend:8000 \
            trust4p-frontend:ci
          docker exec backend sh -c 'echo respuesta-del-backend > /tmp/prueba.txt'
          for i in $(seq 1 20); do curl -fs http://localhost:8080/salud && break; sleep 1; done
          # La SPA responde en cualquier ruta del cliente.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/panel)" = "200"
          curl -s http://localhost:8080/panel | grep -qi "<div id=\"root\""
          # /api/negocio/<ruta> y /api/agente/<ruta> llegan al backend sin el prefijo.
          curl -s http://localhost:8080/api/negocio/prueba.txt | grep -q "respuesta-del-backend"
          curl -s http://localhost:8080/api/agente/prueba.txt | grep -q "respuesta-del-backend"
      - name: Registros de nginx (si falló)
        if: failure()
        run: docker logs web
